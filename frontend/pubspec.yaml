name: tradesquare
description: TradeSquare Flutter client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  file_picker: ^11.0.3
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  supabase_flutter: ^2.15.4
  camera: ^0.11.2+1
  livekit_client: ^2.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/td_logo.jpg
    - assets/td logo.jpg
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
